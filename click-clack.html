			<button class="menu-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="menu-principal">
				<span></span><span></span><span></span>
			</button>
			<nav id="menu-principal">
				<ul class="nav-links">
					<li>
						<a href="index.html"><i class="fas fa-home"></i>Home</a>

		<div>
			<h1>Click&amp;Clack</h1>

				<div class="search-box">
					<input
						type="text"
						id="inputPesquisa"
						placeholder="Search for pen by name or number..."
						onkeyup="filtrarCanetas()"
					/>
				</div>
				<div class="filter-options">
					<button class="btn-filter active" onclick="setFiltro('all', this)">
						All
					</button>
					<button class="btn-filter" onclick="setFiltro('owned', this)">
						Owned
					</button>
					<button class="btn-filter" onclick="setFiltro('missing', this)">
						Missing
					</button>
				</div>
			</div>
		</div>
		<main>
			<div id="status">Loading data...</div>
			<div class="grid-container" id="grid"></div>

		</main>
		<footer class="creditos">
			<div class="social-links">
				<p>Made with love by a Legami collector</p>

			window.PAGE_CONFIG = {

				showColors: false,
			};
		</script>
		<script src="script.js?v=5"></script>
		<script type="module" src="auth.js?v=3"></script>

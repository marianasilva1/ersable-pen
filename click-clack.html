<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="Browse and track the Legami Click&amp;Clack pens collection." />
		<link
			rel="icon"
			href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖋️</text></svg>"
		/>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Crafty+Girls&family=Quicksand:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
		/>
		<title>Click&amp;Clack</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<header class="main-header">
			<div class="logo">🖋️ Legami Collection</div>
			<nav>
				<ul class="nav-links">
					<li>
						<a href="index.html"><i class="fas fa-home"></i>Home</a>
					</li>
					<li>
						<a href="pens.html"><i class="fas fa-pen-nib"></i>Pens</a>
					</li>
					<li>
						<a href="lovely-friends.html"><i class="fas fa-heart"></i>Lovely Friends Gel Pens</a>
					</li>
					<li>
						<a href="packs.html"><i class="fas fa-pen-nib"></i>Packs</a>
					</li>
					<li>
						<a href="click-clack.html" class="active"><i class="fas fa-pen-nib"></i>Click&amp;Clack</a>
					</li>
					<li>
						<a href="free-hugs.html"><i class="fas fa-heart"></i>Free Hugs</a>
					</li>
				</ul>
			</nav>
		</header>
		<div>
			<h1>Click&amp;Clack</h1>

			<div class="nav-container">
				<div class="search-box">
					<input
						type="text"
						id="inputPesquisa"
						placeholder="Search for pen by name or number..."
						onkeyup="filtrarCanetas()"
					/>
				</div>
				<div class="filter-options">
					<button class="btn-filter active" onclick="setFiltro('all', this)">
						All
					</button>
					<button class="btn-filter" onclick="setFiltro('missing', this)">
						Missing
					</button>
				</div>
			</div>
		</div>
		<main>
			<div id="status">Loading data...</div>
			<div class="grid-container" id="grid"></div>

		</main>
		<footer class="creditos">
			<div class="social-links">
				<p>Criado com ❤️ por uma colecionadora</p>

				<a
					href="https://vm.tiktok.com/ZGdm4Tpeg/"
					target="_blank"
					title="TikTok"
				>
					<i class="fab fa-tiktok"></i>
				</a>
				<a
							href="https://www.paypal.me/fmarianas"
							target="_blank"
							title="coffee"
						>
							<i class="fa-solid fa-mug-hot"></i>
						</a>
			</div>

			<p>
				The images and products shown belong to
				<a
					href="https://www.legami.com"
					target="_blank"
					rel="noopener noreferrer"
					>Legami</a
				>.
			</p>
		</footer>
		<button id="backToTop" title="Go to top">
				<svg viewBox="0 0 24 24" width="24" height="24">
						<path fill="currentColor" d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/>
				</svg>
		</button>
		<script>
			window.PAGE_CONFIG = {
				dataUrl: "dadosClickClack.json",
				storageKey: "missingClickClackPens",
				showColors: false,
			};
		</script>
		<script src="script.js"></script>

	</body>
</html>

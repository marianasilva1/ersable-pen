<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventário de Canetas</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 40px 20px;
        }

        h1 { text-align: center; color: #333; margin-bottom: 40px; }

        /* Grid de 6 espaços (3 colunas em telas grandes) */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            border-bottom: 8px solid; /* A cor da caneta virá aqui */
        }

        .card:hover { transform: translateY(-5px); }

        .image-container {
            width: 100%;
            height: 200px;
            background-color: #eee;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .info {
            padding: 20px;
            text-align: center;
        }

        .nome {
            font-size: 1.2rem;
            font-weight: bold;
            color: #2c3e50;
            margin: 0;
        }

        .numero {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-top: 8px;
            background: #f0f0f0;
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
        }

        #status { text-align: center; font-style: italic; color: #666; }
    </style>
</head>
<body>

    <h1>Coleção de Canetas</h1>
    <div id="status">A carregar dados da planilha...</div>
    
    <div class="grid-container" id="grid">
        </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>

    <script>
        // Substitua pelo seu link CSV do Google Sheets
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTl9AIBYVnrLk9ac562139ZxpLufif14WlvV[…]uLCn3LrrbhSU_q7L8EAX/pub?gid=608086363&single=true&output=csv';

        function carregarDados() {
            Papa.parse(SHEET_CSV_URL, {
                download: true,
                header: true,
                complete: function(results) {
                    const data = results.data;
                    const grid = document.getElementById('grid');
                    const status = document.getElementById('status');
                    
                    grid.innerHTML = ''; 
                    status.style.display = 'none';

                    data.slice(0, 6).forEach(item => { // Limita a 6 itens
                        if(item.nome) {
                            const card = document.createElement('div');
                            card.className = 'card';
                            card.style.borderBottomColor = item.cor || '#ccc';

                            card.innerHTML = `
                                <div class="image-container">
                                    <img src="${item.imagem.trim()}" alt="${item.nome}" onerror="this.src='https://via.placeholder.com/300x200?text=Erro+na+Imagem'">
                                </div>
                                <div class="info">
                                    <p class="nome">${item.nome}</p>
                                    <span class="numero">Nº ${item.numero}</span>
                                </div>
                            `;
                            grid.appendChild(card);
                        }
                    });
                },
                error: function(err) {
                    document.getElementById('status').innerText = "Erro ao carregar dados.";
                }
            });
        }

        window.onload = carregarDados;
    </script>
</body>
</html>

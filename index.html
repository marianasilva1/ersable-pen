<!doctype html>
<html lang="pt-pt">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link
			rel="icon"
			href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖋️</text></svg>"
		/>
		<title>Coleção de Canetas</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<header>
			<h1>Pen Collection</h1>
			<div id="status">Loading data...</div>
			<div class="nav-container">
				<a href="packs.html" class="btn-coleccao"> Packs</a>
				<div class="search-box">
					<input
						type="text"
						id="inputPesquisa"
						placeholder="Search for pen by name or number..."
						onkeyup="filtrarCanetas()"
					/>
				</div>
				<div class="filter-options">
					<button class="btn-filter active" onclick="setFiltro('all', this)">
						All
					</button>
					<button class="btn-filter" onclick="setFiltro('missing', this)">
						Missing
					</button>
				</div>
			</div>
		</header>
		<main>
            <div class="grid-container" id="grid"></div>
        </main>
		<footer class="creditos">
			<p>
				The images and products shown belong to
				<a
					href="https://www.legami.com"
					target="_blank"
					rel="noopener noreferrer"
					>Legami</a
				>.
			</p>
		</footer>
        <script src="script.js"></script>
	</body>
</html>
